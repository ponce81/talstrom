name: Build & Deploy

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  id-token: write   # required for AWS OIDC
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # main -> production, anything else -> development
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload to S3
        run: |
          # Hashed assets: cache long-term
          aws s3 sync dist/ "s3://${{ vars.S3_BUCKET }}" --delete \
            --exclude index.html \
            --cache-control "public,max-age=31536000,immutable"
          # index.html: always revalidate so new deploys show up immediately
          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control "no-cache"
